name: Collect Jobs

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Bring down the previous snapshot first, so existing jobs merge with the
      # fresh fetch instead of being lost, and the rate-limit state carries over.
      - name: Sync latest job data
        run: npm run sync-data

      - name: Collect jobs
        run: npm run collect

      # The snapshot goes to the orphan `data` branch as a single force-pushed
      # commit. Committing it to main added ~15 MB of history per day, because
      # jobs.json is rewritten in full on every run.
      - name: Publish data snapshot
        run: |
          npm run publish-data -- "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
